<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
    <img th:src="@{/images/ccrew.png}" alt="CodeCrew Logo" class="site-logo">
</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item"><a class="nav-link" th:href="@{/services}">Services</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/technicians}">Technicians</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/bookings/new}">Book Now</a></li>

                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
                        <a class="nav-link" th:href="@{/admin}">Admin Panel</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/login}">Log In</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="nav-link pe-none" style="font-weight: 600;" sec:authentication="name"></span>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer;">Log Out</button>
                        </form>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
