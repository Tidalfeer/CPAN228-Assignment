<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CodeCrew | Booking Confirmed</title>
    <div th:insert="~{fragments/base :: assetsHead}"></div>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="hero-card">
                    <h2 class="mb-4 brand-text">Booking Confirmed</h2>

                    <p><strong>Booking ID:</strong> <span th:text="${booking.id}"></span></p>
                    <p><strong>Service:</strong> <span th:text="${booking.serviceType}"></span></p>
                    <p><strong>Location:</strong> <span th:text="${booking.location}"></span></p>
                    <p><strong>Date:</strong> <span th:text="${#temporals.format(booking.serviceDate, 'MMM dd, yyyy')}"></span></p>

                    <div class="d-flex gap-2 mt-4">
                        <a th:href="@{/bookings}" class="btn btn-primary">View All Bookings</a>
                        <a th:href="@{/bookings/new}" class="btn btn-outline-light">Book Another</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:insert="~{fragments/base :: assetsScripts}"></div>
</body>
</html>
