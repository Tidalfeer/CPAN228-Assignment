<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
    <div class="container my-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>✓ Booking Confirmed!</h3>
            </div>
            <div class="card-body">
                <p><strong>Booking ID:</strong> <span th:text="${booking.id}"></span></p>
                <p><strong>Service:</strong> <span th:text="${booking.serviceType}"></span></p>
                <p><strong>Location:</strong> <span th:text="${booking.location}"></span></p>
                <p><strong>Date:</strong> <span th:text="${#temporals.format(booking.serviceDate, 'MMM dd, yyyy')}"></span></p>
                <a th:href="@{/bookings}" class="btn btn-primary">View All Bookings</a>
            </div>
        </div>
    </div>
</body>
</html>
