<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CodeCrew | Login</title>
    <div th:insert="~{fragments/base :: assetsHead}"></div>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container main-content d-flex justify-content-center align-items-start">
        <div class="form-panel login-panel mt-4">
            <h1 class="section-title mb-4">LOG IN</h1>

            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                Invalid email or password. Please try again.
            </div>

            <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                You have been logged out successfully.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-4 text-start">
                    <label for="username" class="form-label">Email</label>
                    <input type="text" id="username" name="username"
                           class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="login-links-wrap text-start">
                    <a href="/register" class="login-link">Don't have an account? Sign up.</a>
                </div>

                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:insert="~{fragments/base :: assetsScripts}"></div>
</body>
</html>
