<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CodeCrew | Book a Tech</title>
    <div th:insert="~{fragments/base :: assetsHead}"></div>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="hero-card"> <h2 class="mb-4 brand-text">Schedule a Technician</h2>
                    
                    <form th:action="@{/bookings/save}" th:object="${booking}" method="post">
                        
                        <div class="mb-3">
                            <label class="form-label">Service Type</label>
                            <select th:field="*{serviceType}" class="form-select" 
                                    th:classappend="${#fields.hasErrors('serviceType')} ? 'is-invalid'">
                                <option value="">Select Service...</option>
                                <option value="Code Review">Code Review</option>
                                <option value="Hardware Repair">Hardware Repair</option>
                                <option value="Software Install">Software Install</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{serviceType}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location (Address)</label>
                            <input type="text" th:field="*{location}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{location}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" th:field="*{serviceDate}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('serviceDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{serviceDate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="time" th:field="*{startTime}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{startTime}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Email</label>
                            <input type="email" th:field="*{customerEmail}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('customerEmail')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{customerEmail}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Confirm Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:insert="~{fragments/base :: assetsScripts}"></div>
</body>
</html>
