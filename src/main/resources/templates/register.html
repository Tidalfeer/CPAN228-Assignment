<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CodeCrew | Register</title>
    <div th:insert="~{fragments/base :: assetsHead}"></div>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container main-content d-flex justify-content-center align-items-start">
        <div class="form-panel login-panel mt-4">
            <h1 class="section-title mb-4">SIGN UP</h1>

            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                An account with that email already exists. Please try a different one.
            </div>

            <form th:action="@{/register}" method="post">

                <div class="mb-4 text-start">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name"
                           class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email"
                           class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control" placeholder="Create a password" required>
                </div>

                <div class="login-links-wrap text-start">
                    <a href="/login" class="login-link">Already have an account? Log in.</a>
                </div>

                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:insert="~{fragments/base :: assetsScripts}"></div>
</body>
</html>
